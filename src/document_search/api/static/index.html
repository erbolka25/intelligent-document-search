<!doctype html>
<html lang="ru" class="i18n-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="ui.app.title"></title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/common.js"></script>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="17" height="22" rx="3"/><path d="M9 9h9M9 13h9M9 17h5"/><circle cx="21" cy="21" r="5"/><path d="M25 25l4 4"/></svg>
      <div>
        <h1 data-i18n="ui.app.title"></h1>
        <p class="tagline" data-i18n="ui.app.tagline"></p>
      </div>
    </div>
    <div class="controls" id="controls"></div>
  </header>
  <div class="status" id="status"><span class="pill" data-i18n="ui.status.loading"></span></div>

  <section class="card">
    <h2 data-i18n="ui.upload.heading"></h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".txt,.pdf" multiple>
      <span data-i18n="ui.upload.drop"></span>
    </label>
    <div id="uploadMsg"></div>
    <ul class="docs" id="docs"></ul>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="ask" role="tab" type="button" data-i18n="ui.query.tab_ask"></button>
      <button class="tab" data-mode="search" role="tab" type="button" data-i18n="ui.query.tab_search"></button>
    </div>
    <form class="query" id="queryForm">
      <input id="query" autocomplete="off" maxlength="2000" data-i18n-aria-label="ui.query.label">
      <button class="primary" id="go" type="submit"></button>
    </form>
    <p class="hint" id="hint"></p>
    <div id="output"></div>
  </section>
</div>

<script src="/static/app.js"></script>
</body>
</html>
