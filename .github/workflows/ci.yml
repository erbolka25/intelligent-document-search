name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only torch first, so sentence-transformers does not pull the multi-GB CUDA build.
      - name: Install CPU-only torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: python -m pip install -e ".[dev]"

      # The frontend harness tests (tests/js) use the runner's preinstalled Node and skip without it.
      - name: Show Node version
        run: node --version

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
